name: Release

# Builds and publishes the Windows installer for every version tag, so the
# download button of the site always points at the latest build. The Android APK
# is built and published separately because it must be signed with the release
# keystore, which never leaves the developer machine.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      # electron-builder publishes the installer and the latest.yml manifest the
      # installed app reads to update itself, so the token is required here.
      - run: npm run dist:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
