name: Fox Booster release

# Construit et publie l'installeur Windows de Fox Booster (dossier fox-booster/)
# pour chaque tag `booster-v*`, ex. `git tag booster-v1.0.0 && git push --tags`.
on:
  push:
    tags:
      - 'booster-v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: fox-booster
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: fox-booster/package-lock.json
      - run: npm ci
      - run: npm run dist:win -- --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
